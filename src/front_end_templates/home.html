<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Summary - Audio Transcription & Summarization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #f9fafb;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
            --gradient-start: #8b5cf6;
            --gradient-end: #6366f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fff;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        .upload-container {
            background-color: var(--secondary);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .drag-area {
            border: 2px dashed var(--border);
            height: 300px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: white;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .drag-area.active {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .drag-area .icon {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .drag-area .header {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .drag-area .support {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .drag-area .button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .drag-area .button:hover {
            background-color: var(--primary-hover);
        }

        input[type="file"] {
            display: none;
        }

        .file-details {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background-color: white;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }

        .file-details.show {
            display: block;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .file-size {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .prompt-container {
            margin-bottom: 1.5rem;
        }

        .prompt-container label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .prompt-container textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.125rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
        }

        .result-container {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background-color: white;
            border-radius: 1rem;
            border: 1px solid var(--border);
        }

        .result-container.show {
            display: block;
        }

        .result-section {
            margin-bottom: 1.5rem;
        }

        .result-section h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .result-content {
            background-color: var(--secondary);
            padding: 1rem;
            border-radius: 0.5rem;
            white-space: pre-wrap;
        }

        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid var(--secondary);
            border-bottom-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .status-message {
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
        }

        .error-message {
            color: var(--error);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--text-light);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .upload-container {
                padding: 1.5rem;
            }
            
            .drag-area {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Whisper Summary</h1>
            <h2>Upload your audio files for instant transcription and summarization</h2>
        </header>

        <div class="upload-container">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="drag-area">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <div class="header">Drag & Drop your audio file here</div>
                    <div class="support">Supports MP3, MP4, WAV, M4A, FLAC (max 25MB)</div>
                    <button type="button" class="button">Browse Files</button>
                    <input type="file" id="file-input" accept="audio/*" />
                </div>
                
                <div class="file-details">
                    <div class="file-name"></div>
                    <div class="file-size"></div>
                </div>
                
                <div class="prompt-container">
                    <label for="user-prompt">Summarization Prompt (Optional)</label>
                    <textarea id="user-prompt" name="user_prompt" placeholder="Enter specific instructions for summarization (e.g., 'Focus on key points and action items')"></textarea>
                </div>
                
                <button type="submit" class="submit-btn" disabled>Process Audio</button>
            </form>
            
            <div class="loader"></div>
            <div class="status-message"></div>
            <div class="error-message"></div>
        </div>
        
        <div class="result-container">
            <div class="result-section">
                <h3>Transcription</h3>
                <div class="result-content" id="transcription-result"></div>
            </div>
            
            <div class="result-section">
                <h3>Summary</h3>
                <div class="result-content" id="summary-result"></div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 Whisper Summary. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('upload-form');
            const fileInput = document.getElementById('file-input');
            const dragArea = document.querySelector('.drag-area');
            const browseBtn = dragArea.querySelector('.button');
            const fileDetails = document.querySelector('.file-details');
            const fileName = document.querySelector('.file-name');
            const fileSize = document.querySelector('.file-size');
            const submitBtn = document.querySelector('.submit-btn');
            const loader = document.querySelector('.loader');
            const statusMessage = document.querySelector('.status-message');
            const errorMessage = document.querySelector('.error-message');
            const resultContainer = document.querySelector('.result-container');
            const transcriptionResult = document.getElementById('transcription-result');
            const summaryResult = document.getElementById('summary-result');
            
            // Browse button click event
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // File input change event
            fileInput.addEventListener('change', function() {
                const file = this.files[0];
                showFile(file);
            });
            
            // Drag and drop events
            dragArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dragArea.classList.add('active');
            });
            
            dragArea.addEventListener('dragleave', () => {
                dragArea.classList.remove('active');
            });
            
            dragArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dragArea.classList.remove('active');
                
                const file = e.dataTransfer.files[0];
                showFile(file);
            });
            
            // Show file details
            function showFile(file) {
                const validTypes = ['audio/mpeg', 'audio/wav', 'audio/mp4', 'audio/x-m4a', 'audio/flac', 'video/mp4'];
                
                if (validTypes.includes(file.type)) {
                    const fileReader = new FileReader();
                    
                    fileReader.onload = () => {
                        // Display file details
                        fileDetails.classList.add('show');
                        fileName.textContent = file.name;
                        fileSize.textContent = formatFileSize(file.size);
                        submitBtn.disabled = false;
                    }
                    
                    fileReader.readAsDataURL(file);
                } else {
                    alert('Please upload an audio file (MP3, WAV, MP4, M4A, or FLAC)');
                    submitBtn.disabled = true;
                }
            }
            
            // Format file size
            function formatFileSize(bytes) {
                if (bytes < 1024) {
                    return bytes + ' bytes';
                } else if (bytes < 1048576) {
                    return (bytes / 1024).toFixed(2) + ' KB';
                } else {
                    return (bytes / 1048576).toFixed(2) + ' MB';
                }
            }
            
            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!fileInput.files[0]) {
                    alert('Please select an audio file first');
                    return;
                }
                
                // Show loader and status message
                loader.style.display = 'block';
                statusMessage.textContent = 'Processing your audio file...';
                errorMessage.style.display = 'none';
                submitBtn.disabled = true;
                resultContainer.classList.remove('show');
                
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                
                const userPrompt = document.getElementById('user-prompt').value.trim();
                formData.append('user_prompt', userPrompt || 'Summarize the key points of this audio');
                
                try {
                    const response = await fetch('/transcribe/', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Error: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    // Display results
                    transcriptionResult.textContent = data.transcription;
                    summaryResult.textContent = data.summary;
                    resultContainer.classList.add('show');
                    
                    // Scroll to results
                    resultContainer.scrollIntoView({ behavior: 'smooth' });
                } catch (error) {
                    console.error('Error:', error);
                    errorMessage.textContent = 'Error processing your audio. Please try again.';
                    errorMessage.style.display = 'block';
                } finally {
                    // Hide loader and reset status
                    loader.style.display = 'none';
                    statusMessage.textContent = '';
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
